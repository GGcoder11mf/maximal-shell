general {
    lock_cmd = pidof hyprlock || hyprlock -c ~/.config/hypr/rices/maximal/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 540                     # 9 min: heads-up toast
    on-timeout = qs -p ~/.config/hypr/rices/maximal/shell ipc call toast pop "Idle" "Locking in 60 seconds" "bedtime"
}

listener {
    timeout = 600                     # 10 min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660                     # 11 min: screens off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
