source = ~/.config/hypr/rices/maximal/generated/hyprlock-colors.conf
$font    = Rubik
$mono    = JetBrainsMono Nerd Font
$icons   = Material Symbols Rounded

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 1500
}

animations {
    enabled = true
    bezier = decel, 0.05, 0.7, 0.1, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.08
    animation = fadeIn, 1, 6, decel
    animation = fadeOut, 1, 5, decel
    animation = inputFieldDots, 1, 3, overshot
    animation = inputFieldColors, 1, 5, decel
    animation = inputFieldWidth, 1, 4, overshot
    animation = inputFieldFade, 1, 5, decel
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 4
    blur_size = 7
    noise = 0.02
    contrast = 1.1
    brightness = 0.55
    vibrancy = 0.3
}

# ── giant clock ───────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = $primary
    font_size = 190
    font_family = $font Bold
    position = 0, 300
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = $primary
    shadow_boost = 0.6
}
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $tertiary
    font_size = 190
    font_family = $font Bold
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = $tertiary
    shadow_boost = 0.6
}
label {
    monitor =
    text = cmd[update:60000] date +"%A · %d %B" | tr '[:lower:]' '[:upper:]'
    color = $text
    font_size = 18
    font_family = $font Medium
    position = 0, -60
    halign = center
    valign = center
}

# ── greeting ─────────────────────────────────
label {
    monitor =
    text = cmd[update:600000] h=$(date +%H); if [ $h -lt 6 ]; then echo "still up, $USER?"; elif [ $h -lt 12 ]; then echo "good morning, $USER"; elif [ $h -lt 18 ]; then echo "good afternoon, $USER"; else echo "good evening, $USER"; fi
    color = $muted
    font_size = 14
    font_family = $font
    position = 0, -95
    halign = center
    valign = center
}

# ── avatar ───────────────────────────────────
image {
    monitor =
    path = ~/.face
    size = 96
    rounding = -1
    border_size = 4
    border_color = $primary $tertiary 45deg
    position = 0, -190
    halign = center
    valign = center
}

# ── password ─────────────────────────────────
input-field {
    monitor =
    size = 340, 62
    outline_thickness = 3
    dots_size = 0.28
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = -1
    outer_color = $primary $tertiary 45deg
    inner_color = $surfaceHi
    font_color = $text
    check_color = $tertiary $primary 120deg
    fail_color = $error
    capslock_color = $secondary
    fade_on_empty = false
    rounding = -1
    font_family = $font
    placeholder_text = <span foreground="##ffffff99">  type to unlock</span>
    fail_text = <b>$FAIL</b> · $ATTEMPTS
    position = 0, -305
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
}

# ── now playing ─────────────────────────────
label {
    monitor =
    text = cmd[update:2000] t=$(playerctl metadata --format '{{ title }} — {{ artist }}' 2>/dev/null); [ -n "$t" ] && echo "♫  $t"
    color = $muted
    font_size = 13
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}

# ── corner info ─────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "󰍹  $(uname -n)   $(uptime -p | sed 's/up //')"
    color = $muted
    font_size = 11
    font_family = $mono
    position = 30, 30
    halign = left
    valign = bottom
}
label {
    monitor =
    text = $LAYOUT
    color = $muted
    font_size = 11
    font_family = $mono
    position = -30, 30
    halign = right
    valign = bottom
}
